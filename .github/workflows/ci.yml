name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release manifest and version
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm run check-release-version -- "${GITHUB_REF_NAME}"
      - run: pnpm run verify
